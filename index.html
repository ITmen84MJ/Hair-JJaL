<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />

    <!-- 모바일 뷰포트 최적화 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- 앱 정보 -->
    <title>Hair JJaL — 헤어 상담 이력 관리</title>
    <meta name="description" content="헤어 상담 이력을 쉽게 기록하고 공유하는 서비스입니다." />
    <!-- theme-color: 라이트/다크 모드 각각 지정 (Chrome Android 상단바 색상) -->
    <meta name="theme-color" content="#f43f5e" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <!-- 브라우저 기본 UI(스크롤바·폼) 다크/라이트 모드 인식 -->
    <meta name="color-scheme" content="light dark" />

    <!-- PWA 매니페스트 -->
    <link rel="manifest" href="/Hair-JJaL/manifest.json" />

    <!-- 파비콘 -->
    <link rel="icon" type="image/svg+xml" href="/Hair-JJaL/icon.svg" />

    <!-- iOS Safari "홈 화면에 추가" 지원 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- black-translucent: viewport-fit=cover와 함께 사용 시 상태바가 앱 위에 투명하게 표시 -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hair JJaL" />
    <link rel="apple-touch-icon" href="/Hair-JJaL/apple-touch-icon.png" />

    <!-- Open Graph / 소셜 링크 미리보기 -->
    <meta property="og:type"        content="website" />
    <meta property="og:title"       content="Hair JJaL — 헤어 상담 이력 관리" />
    <meta property="og:description" content="헤어 상담 이력을 쉽게 기록하고 공유하는 서비스입니다." />
    <meta property="og:image"       content="https://itmen84mj.github.io/Hair-JJaL/icon-512.png" />
    <meta property="og:url"         content="https://itmen84mj.github.io/Hair-JJaL/" />
    <meta name="twitter:card"       content="summary" />
    <meta name="twitter:title"      content="Hair JJaL — 헤어 상담 이력 관리" />
    <meta name="twitter:description" content="헤어 상담 이력을 쉽게 기록하고 공유하는 서비스입니다." />
    <meta name="twitter:image"      content="https://itmen84mj.github.io/Hair-JJaL/icon-512.png" />

    <!--
      ════════════════════════════════════════════════════════════
      보안 헤더 (OWASP A03 · MASVS-CODE-2)
      ────────────────────────────────────────────────────────────
      GitHub Pages는 HTTP 헤더 직접 제어 불가 → <meta> 태그로 대체.
      frame-ancestors / HSTS 는 HTTP 헤더 전용이므로 netlify.toml /
      vercel.json 에서 처리 (Netlify·Vercel 이전 시 자동 적용).
      ════════════════════════════════════════════════════════════
    -->

    <!--
      Content-Security-Policy
      ─────────────────────────
      default-src 'self'            : 기본적으로 동일 출처만 허용
      script-src  'self'            : 외부 인라인 스크립트 차단 (SW는 registerSW.js 외부 파일)
      style-src   'self' 'unsafe-inline' : React style={{}} 인라인 속성 허용 불가피
      img-src     'self' data: blob:     : base64 사진(localStorage), Blob URL 허용
      connect-src 'self' https://*.supabase.co wss://*.supabase.co
                                    : 향후 Supabase 백엔드 연동 대비 사전 허용
      worker-src  'self' blob:      : PWA 서비스워커 + Workbox
      manifest-src 'self'           : PWA manifest.json
      object-src  'none'            : Flash·ActiveX 완전 차단
      base-uri    'self'            : <base href> 하이재킹 방지
      form-action 'self'            : 폼 피싱 redirect 차단
      upgrade-insecure-requests     : HTTP 리소스 자동 HTTPS 업그레이드
    -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self';
      style-src 'self' 'unsafe-inline';
      img-src 'self' data: blob:;
      connect-src 'self' https://*.supabase.co wss://*.supabase.co;
      worker-src 'self' blob:;
      manifest-src 'self';
      object-src 'none';
      base-uri 'self';
      form-action 'self';
      upgrade-insecure-requests;
    " />

    <!-- Referrer 정책: 외부 링크(카카오맵 등) 이동 시 경로·파라미터 노출 방지 -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- 노치/다이나믹 아일랜드 대응 safe-area -->
    <!-- padding-bottom은 Sidebar 하단 탭바에서만 처리 (이중 적용 방지) -->
    <style>
      body {
        padding-top: env(safe-area-inset-top);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
