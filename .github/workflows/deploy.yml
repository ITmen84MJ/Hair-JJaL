# ══════════════════════════════════════════════════════════════════
# Hair JJaL — GitHub Pages 자동 배포 + Supabase 자동 설정
#
# 트리거: main 브랜치 push 또는 수동 실행(workflow_dispatch)
# 흐름:  체크아웃 → 빌드 → Pages 배포 → (Supabase) 마이그레이션+함수 배포+데모 시드
#
# ── 필요한 GitHub Secrets ────────────────────────────────────────
# 필수:
#   VITE_USE_SUPABASE       = true
#   VITE_SUPABASE_URL       = https://xxxx.supabase.co
#   VITE_SUPABASE_ANON_KEY  = eyJ...
# Supabase 자동 설정용 (선택 — 없으면 Supabase job 건너뜀):
#   SUPABASE_ACCESS_TOKEN   = sbp_...  (계정 → Access Tokens)
#   SUPABASE_PROJECT_REF    = xxxx     (URL 의 subdomain 부분)
#   SUPABASE_SERVICE_ROLE_KEY = eyJ... (Settings → API → service_role)
#
# Secret이 없으면 VITE_USE_SUPABASE=false(localStorage 모드)로 빌드됨.
# ══════════════════════════════════════════════════════════════════

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:   # GitHub Actions 탭에서 수동 실행 가능

# Pages 배포에 필요한 최소 권한만 부여 (최소 권한 원칙 · MASVS-AUTH-1)
permissions:
  contents: read    # 코드 읽기
  pages:    write   # Pages 배포
  id-token: write   # OIDC 토큰 (배포 인증)

# 동시 배포 방지 — 새 push가 오면 진행 중인 배포를 취소하고 최신 것을 우선
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ── 1. 빌드 ──────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: TypeScript 타입 체크
        run: npx tsc --noEmit

      - name: 프로덕션 빌드
        # Secret이 없으면 각 변수는 빈 문자열 → VITE_USE_SUPABASE=false 동작(localStorage 모드)
        run: npm run build
        env:
          VITE_USE_SUPABASE:      ${{ secrets.VITE_USE_SUPABASE }}
          VITE_SUPABASE_URL:      ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY:  ${{ secrets.VITE_VAPID_PUBLIC_KEY }}

      - name: Pages 아티팩트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # ── 2. 배포 ──────────────────────────────────────────────────────
  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages 배포
        uses: actions/deploy-pages@v4
        id: deployment

  # ── 3. Supabase 설정 (Secret 있을 때만 실행) ─────────────────────
  supabase-setup:
    name: Supabase Setup
    needs: deploy
    runs-on: ubuntu-latest
    # SUPABASE_ACCESS_TOKEN 과 SUPABASE_PROJECT_REF 이 모두 있을 때만 실행
    if: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' && secrets.SUPABASE_PROJECT_REF != '' }}
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Supabase CLI 설치
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Supabase 프로젝트 연결
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: DB 마이그레이션 적용
        run: supabase db push --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: seed-demo Edge Function 배포
        run: supabase functions deploy seed-demo --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: 데모 데이터 + 계정 시드 실행
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "${{ secrets.VITE_SUPABASE_URL }}/functions/v1/seed-demo" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"secret\":\"demo-seed-2024\"}")
          echo "seed-demo HTTP status: $RESPONSE"
          if [ "$RESPONSE" != "200" ]; then
            echo "⚠ seed-demo 실패 (status $RESPONSE) — 데이터는 수동으로 시드해 주세요."
          else
            echo "✓ 데모 데이터 시드 완료"
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}